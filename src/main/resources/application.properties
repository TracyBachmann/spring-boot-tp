spring.application.name=hello

# MariaDB database used by the census API
spring.datasource.url=jdbc:mariadb://localhost:3306/recensement
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Preserve the database schema and existing data
spring.jpa.hibernate.ddl-auto=update

# Hibernate SQL logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keep external API initialization disabled
application.init=false

# Application monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never

# Application information
management.info.env.enabled=true
info.app.name=API Recensement
info.app.description=French cities and departments REST API
info.app.version=1.0
