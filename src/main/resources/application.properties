spring.application.name=hello

# Existing MariaDB census database
spring.datasource.url=jdbc:mariadb://localhost:3306/recensement
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Preserve census data and create missing security tables
spring.jpa.hibernate.ddl-auto=update

# Hibernate SQL logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable external department initialization
application.init=false

# Preserve existing Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.info.env.enabled=true

# Application information
info.app.name=API Recensement
info.app.description=French cities and departments REST API
info.app.version=1.0

# TP03 - Initialize database users only when explicitly enabled
security.seed.enabled=${SECURITY_SEED_ENABLED:false}

# Read demonstration passwords from local environment variables
security.seed.user-password=${SECURITY_USER_PASSWORD:}
security.seed.admin-password=${SECURITY_ADMIN_PASSWORD:}
