
spring.application.name=hello-test

# In-memory database dedicated to automated tests
spring.datasource.url=jdbc:h2:mem:recensement_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically create and remove the test schema
spring.jpa.hibernate.ddl-auto=create-drop

# Disable SQL logging in tests
spring.jpa.show-sql=false

# Never call the external API during tests
application.init=false

# Disable Open Session in View during tests
spring.jpa.open-in-view=false

# TP02 - Dummy credentials used only for automated tests
security.demo.user-password=TestOnlyUser-2026!
security.demo.admin-password=TestOnlyAdmin-2026!

# Disable future database user initialization during tests
security.seed.enabled=false
