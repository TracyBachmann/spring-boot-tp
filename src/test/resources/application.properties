spring.application.name=hello-test

# Temporary in-memory H2 database
spring.datasource.url=jdbc:h2:mem:recensement_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create and remove test tables automatically
spring.jpa.hibernate.ddl-auto=create-drop

# Disable SQL logging during tests
spring.jpa.show-sql=false

# Disable external API initialization
application.init=false

# Disable Open Session in View
spring.jpa.open-in-view=false

# Never initialize real demonstration accounts during tests
security.seed.enabled=false
