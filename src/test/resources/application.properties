spring.application.name=hello-test

# In-memory database used only for automated tests
spring.datasource.url=jdbc:h2:mem:recensement_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create and remove test tables automatically
spring.jpa.hibernate.ddl-auto=create-drop

# Disable SQL logging during tests
spring.jpa.show-sql=false

# Never initialize departments from the external API during tests
application.init=false

# Disable Open Session in View during tests
spring.jpa.open-in-view=false
